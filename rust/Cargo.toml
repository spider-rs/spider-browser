[package]
name = "spider-browser"
version = "0.3.0"
edition = "2021"
description = "Browser automation client for Spider's pre-warmed browser fleet with smart retry and browser switching"
license = "MIT"
authors = ["Spider <maintainers@spider.cloud>"]
repository = "https://github.com/spider-rs/spider-browser"
homepage = "https://spider.cloud"
documentation = "https://docs.rs/spider-browser"
keywords = ["browser", "automation", "scraping", "stealth", "headless"]
categories = ["web-programming", "api-bindings"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"], optional = true }
url = "2"
tracing = "0.1"
thiserror = "2"
dashmap = "6"
arc-swap = "1"
async-trait = "0.1"

[features]
default = ["ai"]
ai = ["reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
